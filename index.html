<!DOCTYPE html>
<html lang="ru" style="background:#000">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Поиск</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        html { background: #000; }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Segoe UI', system-ui, sans-serif;
            font-size: 16px; line-height: 1;
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 10px; }

        /* ── Tabs ── */
        .tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            height: 39px; border-radius: 70px;
            background: #141414; border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 16px; font-family: inherit;
            padding: 0 20px; cursor: pointer;
            transition: background 0.25s, border-color 0.25s;
            display: flex; align-items: center; justify-content: center;
            white-space: nowrap; flex-shrink: 0;
            user-select: none; outline: none;
        }
        .tab:hover { background: #212121; }
        .tab.active { background: #474747; }
        .tab.active:hover { background: #474747; }
        .tab--colored {
            background: rgba(var(--cr),var(--cg),var(--cb), 0.13);
            border-color: rgba(var(--cr),var(--cg),var(--cb), 0.18);
        }
        .tab--colored:hover {
            background: rgba(var(--cr),var(--cg),var(--cb), 0.18);
        }
        .tab--colored.active {
            background: rgba(var(--cr),var(--cg),var(--cb), 0.2);
            border-color: rgba(var(--cr),var(--cg),var(--cb), 0.4);
        }
        .tab--colored.active:hover {
            background: rgba(var(--cr),var(--cg),var(--cb), 0.2);
        }
        .tab--add { width: 39px; padding: 0; }
        .tab--add svg { display: block; }
        .settings-btn {
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s; flex-shrink: 0; outline: none;
            position: relative; z-index: 1;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.18); }

        /* ── Search ── */
        .search-area { position: relative; }
        .search-box {
            display: flex; align-items: center;
            border-radius: 70px; background: #141414;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px; gap: 10px;
            transition: border-color 0.25s, background 0.4s;
            position: relative; z-index: 2; overflow: hidden;
        }
        .search-box:focus-within { border-color: rgba(255,255,255,0.25); }
        .search-gradient {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; border-radius: 70px;
            opacity: 0; transition: opacity 0.4s;
        }
        .search-input {
            flex: 1; min-width: 0; background: transparent; border: none; outline: none;
            color: #fff; font-size: 16px; font-family: inherit;
            padding: 0 0 0 10px; line-height: 30px; caret-color: #fff;
            position: relative; z-index: 1;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.35); }
        .search-btn {
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s; flex-shrink: 0; outline: none;
            position: relative; z-index: 1;
        }
        .search-btn:hover { background: rgba(255,255,255,0.18); }
        .search-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* ── Suggestions ── */
        .suggestions {
            position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 10;
            border-radius: 20px; background: #141414; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px; display: none; flex-direction: column; gap: 5px;
            overflow-y: auto; overscroll-behavior: contain;
        }
        .suggestions.visible { display: flex; animation: sugIn .12s ease-out; }
        .suggestions::-webkit-scrollbar { width: 4px; }
        .suggestions::-webkit-scrollbar-track { background: transparent; margin: 10px 0; }
        .suggestions::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
        .suggestions { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.12) transparent; }
        @keyframes sugIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
        .suggestion-item {
            border-radius: 10px; padding: 10px; cursor: pointer;
            transition: background 0.1s; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; font-size: 16px; line-height: 1.25;
            display: flex; align-items: center; gap: 10px; flex-shrink: 0;
        }
        .suggestion-item:hover, .suggestion-item.selected { background: #212121; }
        .suggestion-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.35; }
        .suggestion-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ── Popup overlay ── */
        .popup-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
        .popup-overlay.open { opacity: 1; pointer-events: all; }
        .popup {
            width: 100%; max-width: 480px;
            border-radius: 20px; background: #141414;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; display: flex; flex-direction: column; gap: 20px;
            transform: translateY(10px) scale(0.97);
            transition: transform 0.3s ease-out;
        }
        .popup-overlay.open .popup { transform: translateY(0) scale(1); }
        .popup-section { display: flex; flex-direction: column; gap: 13px; }
        .popup-label { font-size: 16px; color: #fff; }
        .popup-input {
            width: 100%; border-radius: 10px; background: #141414;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 16px; color: #fff; font-size: 16px; font-family: inherit;
            outline: none; transition: border-color 0.2s;
        }
        .popup-input::placeholder { color: rgba(255,255,255,0.2); }
        .popup-input:focus { border-color: rgba(255,255,255,0.25); }
        .popup-detect-btn {
            width: 100%; border-radius: 40px;
            background: rgba(255,255,255,0.07); border: 1px solid #363636;
            padding: 16px 10px; color: #fff; font-size: 16px;
            font-family: inherit; font-weight: 500; cursor: pointer;
            text-align: center; transition: background 0.15s; outline: none;
        }
        .popup-detect-btn:hover { background: rgba(255,255,255,0.12); }
        .popup-colors { display: flex; flex-wrap: wrap; gap: 13px; }
        .popup-color {
            width: 40px; height: 40px; border-radius: 50%;
            border: 3px solid #272727; cursor: pointer;
            transition: border-color 0.2s, transform 0.15s; outline: none;
        }
        .popup-color:hover { transform: scale(1.1); }
        .popup-color.selected { border-color: #fff; }
        .popup-save {
            width: 100%; border-radius: 40px; background: #fff;
            border: 1px solid #141414; padding: 16px 10px;
            color: #141414; font-size: 16px; font-family: inherit;
            font-weight: 500; cursor: pointer; text-align: center;
            transition: opacity 0.15s; outline: none;
        }
        .popup-save:hover { opacity: 0.9; }

        @media print { body { background: #000; } .suggestions, .popup-overlay { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs" id="tabs"></div>
    <div class="search-area">
        <div class="search-box" id="searchBox">
            <div class="search-gradient" id="searchGradient"></div>
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск в Google" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus>
            <button class="search-btn" id="searchBtn" aria-label="Искать">
                <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
            </button>
            <button class="settings-btn" id="settingsBtn" aria-label="Настройки">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="16" viewBox="0 0 14 16" fill="none"><path d="M5.92773 0.26782C6.54642 -0.0892734 7.30905 -0.0892733 7.92773 0.26782L12.8555 3.11354C13.4741 3.47068 13.8552 4.13074 13.8555 4.84499V10.5364L13.8516 10.6692C13.8074 11.3318 13.4355 11.9329 12.8555 12.2679L7.92773 15.1136L7.81055 15.1761C7.25415 15.4499 6.60132 15.4499 6.04492 15.1761L5.92773 15.1136L1 12.2679C0.419933 11.9329 0.0480285 11.3318 0.00390625 10.6692L0 10.5364V4.84499C0.000241219 4.17529 0.335009 3.55323 0.886719 3.18385L1 3.11354L5.92773 0.26782ZM7.42773 1.13404C7.11841 0.955514 6.73706 0.955514 6.42773 1.13404L1.5 3.97975C1.19081 4.15827 1.00026 4.488 1 4.84499V10.5364C1.00014 10.8935 1.1908 11.2231 1.5 11.4017L6.42773 14.2474C6.73713 14.426 7.11834 14.426 7.42773 14.2474L12.3555 11.4017C12.6647 11.2231 12.8553 10.8935 12.8555 10.5364V4.84499C12.8552 4.488 12.6647 4.15827 12.3555 3.97975L7.42773 1.13404ZM6.92773 6.6907C7.47991 6.6907 7.92756 7.13857 7.92773 7.69071C7.92773 8.243 7.48002 8.69071 6.92773 8.69071C6.37545 8.69071 5.92773 8.243 5.92773 7.69071C5.92791 7.13857 6.37556 6.6907 6.92773 6.6907Z" fill="white"/></svg>
            </button>
        </div>
        <div class="suggestions" id="suggestions"></div>
    </div>
</div>

<div class="popup-overlay" id="popupOverlay">
    <div class="popup" id="popup">
        <div class="popup-section">
            <div class="popup-label">Название</div>
            <input class="popup-input" id="popupName" placeholder="Beatport" autocomplete="off">
        </div>
        <div class="popup-section">
            <div class="popup-label">Ссылка</div>
            <input class="popup-input" id="popupUrl" placeholder="https://www.beatport.com/search?q=" autocomplete="off">
            <button class="popup-detect-btn" id="popupDetect">Определить ключ</button>
        </div>
        <div class="popup-section">
            <div class="popup-label">Цвет</div>
            <div class="popup-colors" id="popupColors"></div>
        </div>
        <button class="popup-save" id="popupSave">Сохранить</button>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ── Colors ── */
    var PALETTE = ['#ffffff','#e57373','#f28b54','#d9a441','#b8b84d','#81c784','#4db6ac','#4fc3f7','#64b5f6','#7986cb','#9575cd','#ba68c8','#f06292','#64808e'];

    /* ── Search key database ── */
    var SEARCH_DB = {
        'google':'https://www.google.com/search?q=','yandex':'https://yandex.ru/search/?text=','яндекс':'https://yandex.ru/search/?text=',
        'youtube':'https://www.youtube.com/results?search_query=','bing':'https://www.bing.com/search?q=',
        'duckduckgo':'https://duckduckgo.com/?q=','yahoo':'https://search.yahoo.com/search?p=',
        'wikipedia':'https://ru.wikipedia.org/wiki/Служебная:Поиск?search=','вики':'https://ru.wikipedia.org/wiki/Служебная:Поиск?search=',
        'amazon':'https://www.amazon.com/s?k=','ebay':'https://www.ebay.com/sch/i.html?_nkw=',
        'github':'https://github.com/search?q=','stackoverflow':'https://stackoverflow.com/search?q=',
        'reddit':'https://www.reddit.com/search/?q=','twitter':'https://x.com/search?q=','x':'https://x.com/search?q=',
        'instagram':'https://www.instagram.com/explore/tags/','pinterest':'https://www.pinterest.com/search/pins/?q=',
        'spotify':'https://open.spotify.com/search/','soundcloud':'https://soundcloud.com/search?q=',
        'beatport':'https://www.beatport.com/search?q=','apple music':'https://music.apple.com/search?term=',
        'aliexpress':'https://www.aliexpress.com/wholesale?SearchText=','ozon':'https://www.ozon.ru/search/?text=','озон':'https://www.ozon.ru/search/?text=',
        'wildberries':'https://www.wildberries.ru/catalog/0/search.aspx?search=','вб':'https://www.wildberries.ru/catalog/0/search.aspx?search=',
        'avito':'https://www.avito.ru/rossiya?q=','авито':'https://www.avito.ru/rossiya?q=',
        'habr':'https://habr.com/ru/search/?q=','хабр':'https://habr.com/ru/search/?q=',
        'npm':'https://www.npmjs.com/search?q=','twitch':'https://www.twitch.tv/search?term=',
        'vk':'https://vk.com/search?c%5Bq%5D=','вк':'https://vk.com/search?c%5Bq%5D=',
        'telegram':'https://t.me/s/','yandex maps':'https://yandex.ru/maps/?text=','яндекс карты':'https://yandex.ru/maps/?text=',
        'google maps':'https://www.google.com/maps/search/','imdb':'https://www.imdb.com/find/?q=',
        'kinopoisk':'https://www.kinopoisk.ru/index.php?kp_query=','кинопоиск':'https://www.kinopoisk.ru/index.php?kp_query=',
        'netflix':'https://www.netflix.com/search?q=','hh':'https://hh.ru/search/vacancy?text=',
        'linkedin':'https://www.linkedin.com/search/results/all/?keywords=',
        'figma':'https://www.figma.com/community/search?query=','dribbble':'https://dribbble.com/search/',
        'behance':'https://www.behance.net/search/projects?search=','unsplash':'https://unsplash.com/s/photos/',
        'pexels':'https://www.pexels.com/search/','translate':'https://translate.google.com/?sl=auto&tl=ru&text=',
        'переводчик':'https://translate.google.com/?sl=auto&tl=ru&text=','перевод':'https://translate.google.com/?sl=auto&tl=ru&text=',
        'chatgpt':'https://chatgpt.com/?q=','perplexity':'https://www.perplexity.ai/search?q=',
        'wolfram':'https://www.wolframalpha.com/input?i=','notion':'https://www.notion.so/search?q=',
        'trello':'https://trello.com/search?q=','jira':'https://jira.atlassian.com/search?q=',
        'codepen':'https://codepen.io/search/pens?q=','deviantart':'https://www.deviantart.com/search?q=',
        'flickr':'https://www.flickr.com/search/?text=','gitlab':'https://gitlab.com/search?search=',
        'medium':'https://medium.com/search?q=','quora':'https://www.quora.com/search?q=',
        'tiktok':'https://www.tiktok.com/search?q=','тикток':'https://www.tiktok.com/search?q=',
    };

    /* ── Default engines ── */
    var DEFAULTS = [
        { id: 'google',  name: 'Google',  url: 'https://www.google.com/search?q=',              placeholder: 'Поиск в Google' },
        { id: 'yandex',  name: 'Яндекс',  url: 'https://yandex.ru/search/?text=',               placeholder: 'Поиск в Яндексе' },
        { id: 'youtube', name: 'YouTube', url: 'https://www.youtube.com/results?search_query=', placeholder: 'Поиск на YouTube' },
    ];

    var engines = DEFAULTS.slice();
    var customEngines = [];
    var activeIdx = 0;
    var sug = [], sel = -1, tid = null, fid = 0, jid = 0;

    var $in = document.getElementById('searchInput');
    var $sg = document.getElementById('suggestions');
    var $btn = document.getElementById('searchBtn');
    var $tb = document.getElementById('tabs');
    var $box = document.getElementById('searchBox');
    var $grad = document.getElementById('searchGradient');
    var $overlay = document.getElementById('popupOverlay');
    var $popName = document.getElementById('popupName');
    var $popUrl = document.getElementById('popupUrl');
    var $popDetect = document.getElementById('popupDetect');
    var $popColors = document.getElementById('popupColors');
    var $popSave = document.getElementById('popupSave');

    /* ── localStorage ── */
    function loadCustom() {
        try { customEngines = JSON.parse(localStorage.getItem('customEngines') || '[]'); } catch(e) { customEngines = []; }
    }
    function saveCustom() { localStorage.setItem('customEngines', JSON.stringify(customEngines)); }

    /* ── Color helpers ── */
    function hexToHSL(hex) {
        var r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
        var max = Math.max(r,g,b), min = Math.min(r,g,b), h, s, l = (max+min)/2;
        if (max===min) { h=s=0; } else {
            var d = max-min; s = l > 0.5 ? d/(2-max-min) : d/(max+min);
            switch(max) { case r: h=((g-b)/d+(g<b?6:0))/6; break; case g: h=((b-r)/d+2)/6; break; case b: h=((r-g)/d+4)/6; break; }
        }
        return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
    }

    function applyEngineColor(eng) {
        var c = eng && eng.color;
        if (!c) {
            $box.style.borderColor = '';
            $grad.style.opacity = '0';
            return;
        }
        var hsl = hexToHSL(c);
        $box.style.borderColor = c.replace('#','rgba(') ? 'rgba(' + parseInt(c.slice(1,3),16)+','+parseInt(c.slice(3,5),16)+','+parseInt(c.slice(5,7),16)+',0.4)' : '';
        var darkL = Math.max(0, hsl[2] - 20);
        var gradColor = 'hsla('+hsl[0]+','+hsl[1]+'%,'+darkL+'%,';
        $grad.style.background = 'linear-gradient(91deg, '+gradColor+'0.2) 0%, '+gradColor+'0) 62%)';
        $grad.style.opacity = '1';
    }

    /* ── Render tabs ── */
    function buildEngines() {
        engines = DEFAULTS.slice();
        customEngines.forEach(function(ce) {
            engines.push({ id: 'custom_'+ce.name, name: ce.name, url: ce.url, placeholder: 'Поиск: '+ce.name, color: ce.color });
        });
    }

    function renderTabs() {
        var html = '';
        engines.forEach(function(eng, i) {
            var cls = 'tab' + (i === activeIdx ? ' active' : '');
            var style = '';
            if (eng.color) {
                var r = parseInt(eng.color.slice(1,3),16), g = parseInt(eng.color.slice(3,5),16), b = parseInt(eng.color.slice(5,7),16);
                cls += ' tab--colored';
                style = ' style="--cr:'+r+';--cg:'+g+';--cb:'+b+'"';
            }
            html += '<button class="'+cls+'" data-idx="'+i+'"'+style+'>'+esc(eng.name)+'</button>';
        });
        html += '<button class="tab tab--add" data-action="add"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 0C5.77614 0 6 0.223858 6 0.5V5H10.5C10.7761 5 11 5.22386 11 5.5C11 5.77614 10.7761 6 10.5 6H6V10.5C6 10.7761 5.77614 11 5.5 11C5.22386 11 5 10.7761 5 10.5V6H0.5C0.223858 6 0 5.77614 0 5.5C0 5.22386 0.223858 5 0.5 5H5V0.5C5 0.223858 5.22386 0 5.5 0Z" fill="white"/></svg></button>';
        $tb.innerHTML = html;
    }

    function setActive(idx) {
        if (idx < 0 || idx >= engines.length) return;
        activeIdx = idx;
        renderTabs();
        var eng = engines[idx];
        $in.placeholder = eng.placeholder;
        applyEngineColor(eng);
        if ($in.value.trim()) doFetch();
        else hideSug();
        $in.focus();
    }

    /* ── JSONP ── */
    function jsonp(url, ms) {
        ms = ms || 4000;
        return new Promise(function(ok, fail) {
            var n = '_c'+(++jid)+'_'+Date.now(), s = document.createElement('script'), d = false, t;
            function cl() { d=true; clearTimeout(t); try{delete window[n]}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); }
            window[n] = function(r) { if(d)return; cl(); ok(r); };
            s.src = url+'&callback='+n; s.referrerPolicy='no-referrer';
            s.onerror = function() { if(d)return; cl(); fail(new Error('net')); };
            t = setTimeout(function() { if(!d){cl();fail(new Error('to'));} }, ms);
            document.head.appendChild(s);
        });
    }

    /* ── Fetchers ── */
    function getGoogle(q) { return jsonp('https://suggestqueries.google.com/complete/search?client=chrome&hl=ru&gl=ru&q='+q).then(function(d){return d&&d[1]||[];}); }
    function getYouTube(q) { return jsonp('https://suggestqueries.google.com/complete/search?client=chrome&ds=yt&hl=ru&q='+q).then(function(d){return d&&d[1]||[];}); }
    function getYandex(q) {
        return jsonp('https://suggest.yandex.ru/suggest-ya.cgi?v=4&uil=ru&lr=213&sn=10&part='+q, 3000)
            .then(parseYa)
            .catch(function() {
                return fetch('https://suggest.yandex.ru/suggest-ff.cgi?part='+q+'&uil=ru&sn=10&lr=213')
                    .then(function(r){return r.json();}).then(function(d){return d&&d[1]||[];})
                    .catch(function(){return jsonp('https://suggest.yandex.ru/suggest-ya.cgi?part='+q+'&v=4&sn=10',3000).then(parseYa);});
            });
    }
    function parseYa(d) { if(!d||!d[1])return[]; return d[1].map(function(i){return typeof i==='string'?i:Array.isArray(i)?i[1]:null;}).filter(Boolean); }

    function getSuggestions(query) {
        var q = encodeURIComponent(query), id = ++fid, eng = engines[activeIdx], p;
        if (eng.id === 'google') p = getGoogle(q);
        else if (eng.id === 'youtube') p = getYouTube(q);
        else if (eng.id === 'yandex') p = getYandex(q);
        else p = Promise.resolve([]);
        return p.then(function(items) { return id===fid ? items : []; });
    }

    /* ── Suggestions UI ── */
    var ico = '<svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>';

    function calcMaxH() {
        var r = $box.getBoundingClientRect();
        $sg.style.maxHeight = Math.max(120, window.innerHeight - r.bottom - 15) + 'px';
    }

    function showSug(items) {
        sug = items.slice(0,10); sel = -1;
        if (!sug.length) { hideSug(); return; }
        $sg.innerHTML = sug.map(function(t,i) { return '<div class="suggestion-item" data-i="'+i+'">'+ico+'<span class="suggestion-text">'+esc(t)+'</span></div>'; }).join('');
        calcMaxH(); $sg.scrollTop = 0; $sg.classList.add('visible');
    }
    function hideSug() { $sg.classList.remove('visible'); sug=[]; sel=-1; }
    function updSel() {
        var items = $sg.querySelectorAll('.suggestion-item');
        for (var i=0;i<items.length;i++) items[i].classList.toggle('selected', i===sel);
        if (sel>=0 && items[sel]) items[sel].scrollIntoView({block:'nearest'});
    }
    function esc(s) { var d=document.createElement('span'); d.textContent=s; return d.innerHTML; }
    function go(q) { q=(q||'').trim(); if(q) window.open(engines[activeIdx].url+encodeURIComponent(q),'_blank'); }
    function doFetch() { var v=$in.value.trim(); if(!v){hideSug();return;} getSuggestions(v).then(showSug).catch(function(){hideSug();}); }

    /* ── Events ── */
    $in.addEventListener('input', function() { clearTimeout(tid); tid=setTimeout(doFetch,150); });
    $in.addEventListener('focus', function() { if($in.value.trim()) doFetch(); });
    $in.addEventListener('keydown', function(e) {
        if(e.key==='Enter'){e.preventDefault();go(sel>=0&&sug[sel]?sug[sel]:$in.value);hideSug();}
        else if(e.key==='ArrowDown'){e.preventDefault();if(!sug.length)return;sel=Math.min(sel+1,sug.length-1);updSel();$in.value=sug[sel];}
        else if(e.key==='ArrowUp'){e.preventDefault();if(sel>0){sel--;updSel();$in.value=sug[sel];}else if(sel===0){sel=-1;updSel();}}
        else if(e.key==='Escape') hideSug();
        else if(e.key==='Tab'){e.preventDefault();setActive((activeIdx+(e.shiftKey?-1:1)+engines.length)%engines.length);}
    });
    $btn.addEventListener('click', function(){go($in.value);});
    document.getElementById('settingsBtn').addEventListener('click', function() {
        var eng = engines[activeIdx];
        var custIdx = activeIdx - DEFAULTS.length;
        if (custIdx >= 0 && customEngines[custIdx]) {
            openPopupEdit(custIdx);
        } else {
            openPopup();
        }
    });
    $tb.addEventListener('click', function(e) {
        var t=e.target.closest('.tab'); if(!t)return;
        if(t.dataset.action==='add'){openPopup();return;}
        if(t.dataset.idx!==undefined) setActive(parseInt(t.dataset.idx,10));
    });
    $sg.addEventListener('click', function(e){var it=e.target.closest('.suggestion-item');if(!it)return;var i=parseInt(it.dataset.i,10);if(sug[i]){$in.value=sug[i];go(sug[i]);hideSug();}});
    document.addEventListener('click', function(e){if(!e.target.closest('.container'))hideSug();});
    window.addEventListener('resize', function(){if($sg.classList.contains('visible'))calcMaxH();});

    /* ── Popup ── */
    var popColor = null;
    var editIdx = -1;

    function renderColorPicker() {
        $popColors.innerHTML = PALETTE.map(function(c) {
            return '<button class="popup-color'+(c===popColor?' selected':'')+'" data-color="'+c+'" style="background:'+c+'"></button>';
        }).join('');
    }

    function openPopup() {
        editIdx = -1; popColor = null;
        $popName.value = ''; $popUrl.value = '';
        $popSave.textContent = 'Сохранить';
        renderColorPicker();
        $overlay.classList.add('open');
        setTimeout(function(){$popName.focus();},100);
    }

    function openPopupEdit(custIdx) {
        var ce = customEngines[custIdx];
        if (!ce) { openPopup(); return; }
        editIdx = custIdx;
        $popName.value = ce.name;
        $popUrl.value = ce.url;
        popColor = ce.color || null;
        $popSave.textContent = 'Сохранить';
        renderColorPicker();
        $overlay.classList.add('open');
        setTimeout(function(){$popName.focus();},100);
    }

    function closePopup() { $overlay.classList.remove('open'); $in.focus(); }

    $overlay.addEventListener('click', function(e) { if(e.target===$overlay) closePopup(); });

    $popColors.addEventListener('click', function(e) {
        var btn = e.target.closest('.popup-color'); if(!btn) return;
        popColor = btn.dataset.color;
        $popColors.querySelectorAll('.popup-color').forEach(function(b){b.classList.toggle('selected',b.dataset.color===popColor);});
    });

    $popDetect.addEventListener('click', function() {
        var name = $popName.value.trim().toLowerCase();
        if (!name) { $popName.focus(); return; }
        var found = SEARCH_DB[name];
        if (!found) {
            var clean = name.replace(/\s+/g,'').replace(/[^a-zа-яё0-9]/gi,'');
            found = SEARCH_DB[clean];
        }
        if (!found) {
            var domain = name.replace(/\s+/g,'').replace(/[^a-z0-9.-]/gi,'');
            if (domain.indexOf('.') === -1) domain = 'www.' + domain + '.com';
            found = 'https://' + domain + '/search?q=';
        }
        $popUrl.value = found;
    });

    $popSave.addEventListener('click', function() {
        var name = $popName.value.trim();
        var url = $popUrl.value.trim();
        if (!name) { $popName.focus(); return; }
        if (!url) { $popUrl.focus(); return; }
        if (!url.includes('%s') && !url.endsWith('=') && !url.endsWith('/')) url += '?q=';
        if (editIdx >= 0) {
            customEngines[editIdx] = { name: name, url: url, color: popColor };
        } else {
            customEngines.push({ name: name, url: url, color: popColor });
        }
        saveCustom(); buildEngines(); setActive(editIdx >= 0 ? DEFAULTS.length + editIdx : engines.length - 1);
        closePopup();
    });

    /* ── Init ── */
    loadCustom(); buildEngines(); renderTabs();
    applyEngineColor(engines[activeIdx]);
})();
</script>

</body>
</html>
