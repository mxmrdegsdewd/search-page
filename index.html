    /* ── Audio capture ── */
    function combineChunks(chunks){
        var total=0;for(var i=0;i<chunks.length;i++)total+=chunks[i].length;

        for(var j=0;j<chunks.length;j++){combined.set(chunks[j],off);off+=chunks[j].length}
        return combined
    }
    function resampleTo16k(data,srcRate){
        if(srcRate===16000)return data;
        var ratio=srcRate/16000,newLen=Math.round(data.length/ratio),out=new Float32Array(newLen);
        for(var k=0;k<newLen;k++){var si=k*ratio,fl=Math.floor(si);out[k]=data[fl]*(1-(si-fl))+(data[Math.min(fl+1,data.length-1)]||0)*(si-fl)}
        return out
    }
    function getAllAudio(){
        if(!rawChunks.length)return null;
        var combined=combineChunks(rawChunks);

    }

    function startMic(){
        rawChunks=[];

            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
            audioSource=audioCtx.createMediaStreamSource(stream);
            audioProcessor=audioCtx.createScriptProcessor(4096,1,1);
            audioProcessor.onaudioprocess=function(e){if(micOn)rawChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
            audioSource.connect(audioProcessor);audioProcessor.connect(audioCtx.destination);
            micOn=true;recSeconds=0;
            recTimer=setInterval(function(){
                recSeconds++;
                var m=Math.floor(recSeconds/60),s=recSeconds%60;
                showSourceDirect('● '+m+':'+(s<10?'0':'')+s)
            },1000);
            console.log('[mic] started, sampleRate='+audioCtx.sampleRate)
        })
    }

        micOn=false;clearInterval(recTimer);
        if(audioProcessor){audioProcessor.disconnect();audioProcessor=null}
        if(audioSource){try{audioSource.mediaStream.getTracks().forEach(function(t){t.stop()})}catch(e){}audioSource.disconnect();audioSource=null}
        if(audioCtx){audioCtx.close().catch(function(){});audioCtx=null}
    }

            $mic.classList.remove('mic-processing');
            $i.setAttribute('contenteditable','true');

            }
            setPlaceholder();showSourceMetrics();
            console.log('[finish] done: "'+(full||'').slice(0,80)+'"');
            if(cb)cb(full||'')
        })
    }

        }
        var text=getText().trim();if(!text)return;
        copyText(text);
        showCheckmark()
    });

    /* ── Search box height animation ── */
    var boxH=0,rafId=0,heightReady=false;
    setTimeout(function(){boxH=$bx.offsetHeight;heightReady=true},300);
    function updateBoxHeight(){
        if(!heightReady)return;cancelAnimationFrame(rafId);
        rafId=requestAnimationFrame(function(){
            var current=$bx.style.height?parseInt($bx.style.height):boxH;
            $bx.style.height='auto';var target=$bx.offsetHeight;
            if(boxH>0&&Math.abs(target-current)>2){$bx.style.height=current+'px';$bx.offsetHeight;$bx.style.height=target+'px'}
            else{$bx.style.height=''}
            boxH=target
        })
    }
    new MutationObserver(updateBoxHeight).observe($i,{childList:true,subtree:true,characterData:true});
    $bx.addEventListener('transitionend',function(e){if(e.propertyName==='height'){boxH=$bx.offsetHeight;$bx.style.height=''}});
    $i.addEventListener('scroll',function(){$iw.classList.toggle('scrolled',$i.scrollTop>5)});
    $iw.addEventListener('click',function(e){if(e.target===$iw){$i.focus();moveCursorEnd()}});

    /* ── Settings / tabs / popup ── */
    document.getElementById('settingsBtn').addEventListener('click',function(){openEdit(aIdx)});
    $t.addEventListener('click',function(e){var t=e.target.closest('.tab');if(!t)return;if(t.dataset.action==='add'){openAdd();return}if(t.dataset.idx!==undefined)setAct(parseInt(t.dataset.idx,10))});
    $s.addEventListener('click',function(e){var it=e.target.closest('.si');if(!it)return;var i=parseInt(it.dataset.i,10);if(sug[i]){setText(sug[i]);go(sug[i]);hideS()}});
    document.addEventListener('click',function(e){if(!e.target.closest('.container'))hideS()});
    window.addEventListener('resize',function(){if($s.classList.contains('visible'))calcH()});

    var pColor=null,editMode=null,editKey=null,popupKeys=[];
    function renderPC(){$pc.innerHTML=PAL.map(function(c){return'<button class="pc'+(c===pColor?' sel':'')+'" data-c="'+c+'" style="background:'+c+'"></button>'}).join('')}
    function renderPopupKeys(){
        var pp=document.getElementById('popup'),h1=pp.offsetHeight;
        $pkt.innerHTML=popupKeys.map(function(k,i){return'<div class="pk-tag"><input class="pk-tag-inp" value="'+esc(k)+'" data-ki="'+i+'" maxlength="5"><span class="pk-tag-x" data-ki="'+i+'">×</span></div>'}).join('');
        $pkt.style.display=popupKeys.length?'':'none';
        requestAnimationFrame(function(){var h2=pp.offsetHeight;if(Math.abs(h2-h1)>2){pp.style.height=h1+'px';pp.offsetHeight;pp.style.transition='transform .2s ease-out, height 300ms cubic-bezier(0.34,1.3,0.64,1)';pp.style.height=h2+'px';var done=function(ev){if(ev.propertyName==='height'){pp.style.height='';pp.style.transition='transform .2s ease-out';pp.removeEventListener('transitionend',done)}};pp.addEventListener('transitionend',done)}})
    }
    function addPopupKey(){var v=$pki.value.trim().toLowerCase();if(!v)return;if(popupKeys.indexOf(v)<0)popupKeys.push(v);renderPopupKeys();$pki.value=''}
    function openAdd(){editMode='add';editKey=null;pColor=null;$pn.value='';popupKeys=[];renderPopupKeys();$pki.value='';$pu.value='';$pdl.classList.remove('vis');renderPC();$ov.classList.add('open');setTimeout(function(){$pn.focus()},100)}
    function openEdit(idx){var e=engs[idx];if(!e)return;if(e.isDef){editMode='def';editKey=e.id}else{editMode='custom';editKey=idx-DEFS.length}$pn.value=e.name;popupKeys=(e.keys||[]).slice();renderPopupKeys();$pki.value='';$pu.value=e.url;pColor=e.color||null;$pdl.classList.add('vis');renderPC();$ov.classList.add('open');setTimeout(function(){$pn.focus()},100)}
    function closeP(){$ov.classList.remove('open');$i.focus()}
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$ov.classList.contains('open')){e.preventDefault();closeP()}});
    $ov.addEventListener('click',function(e){if(e.target===$ov)closeP()});
    $pc.addEventListener('click',function(e){var b=e.target.closest('.pc');if(!b)return;pColor=b.dataset.c;$pc.querySelectorAll('.pc').forEach(function(x){x.classList.toggle('sel',x.dataset.c===pColor)})});
    $pkt.addEventListener('click',function(e){var x=e.target.closest('.pk-tag-x');if(!x)return;popupKeys.splice(parseInt(x.dataset.ki,10),1);renderPopupKeys()});
    $pkt.addEventListener('input',function(e){var inp=e.target.closest('.pk-tag-inp');if(!inp)return;inp.value=inp.value.toLowerCase();popupKeys[parseInt(inp.dataset.ki,10)]=inp.value});
    $pka.addEventListener('click',addPopupKey);
    $pki.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addPopupKey()}});
    $pki.addEventListener('input',function(){var v=$pki.value,lo=v.toLowerCase();if(v!==lo){var p=$pki.selectionStart;$pki.value=lo;$pki.selectionStart=$pki.selectionEnd=p}});
    $pd.addEventListener('click',function(){var n=$pn.value.trim();if(!n){$pn.focus();return}var lo=n.toLowerCase();var f=SDB[lo];if(f){$pu.value=f;return}var raw=lo.replace(/\s+/g,'').replace(/[^a-z0-9а-яё.-]/gi,'');var doms=[];if(raw.indexOf('.')!==-1)doms.push(raw);else if(/[а-яё]/i.test(raw))doms.push(raw+'.ru',raw+'.com');else doms.push(raw+'.com',raw+'.ru');$pu.value='https://'+doms[0]+'/search?q='});
    $ps.addEventListener('click',function(){var nm=$pn.value.trim(),ur=$pu.value.trim();var pki=$pki.value.trim().toLowerCase();if(pki&&popupKeys.indexOf(pki)<0)popupKeys.push(pki);if(!nm){$pn.focus();return}if(!ur){$pu.focus();return}if(!ur.includes('%s')&&!ur.endsWith('=')&&!ur.endsWith('/'))ur+='?q=';if(editMode==='def'){defOvr[editKey]={name:nm,url:ur,color:pColor,keys:popupKeys.slice()};save();build();setAct(DEFS.findIndex(function(d){return d.id===editKey}))}else if(editMode==='custom'){custom[editKey]={name:nm,url:ur,color:pColor,keys:popupKeys.slice()};save();build();setAct(DEFS.length+editKey)}else{custom.push({name:nm,url:ur,color:pColor,keys:popupKeys.slice()});save();build();setAct(engs.length-1)}closeP()});
    $pdl.addEventListener('click',function(){if(editMode==='custom'&&editKey>=0){custom.splice(editKey,1);save();build();setAct(0);closeP()}else if(editMode==='def'&&editKey){delete defOvr[editKey];save();build();setAct(DEFS.findIndex(function(d){return d.id===editKey}));closeP()}});

    load();build();renderTabs();applyColor(engs[aIdx]);
    setPlaceholder('Loading...');
    $i.focus();
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&!micOn&&!workerBusy)setPlaceholder()});
})();
</script>
</body>
</html>
