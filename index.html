    /* ── Source label: animated (for search) and direct (for status) ── */
    var sourceDelay=null,sourceAnim=null;

    function jsonp(url,ms){ms=ms||4000;return new Promise(function(ok,f){var n='_c'+(++jid)+'_'+Date.now(),sc=document.createElement('script'),d=false,tm;function cl(){d=true;clearTimeout(tm);try{delete window[n]}catch(e){}if(sc.parentNode)sc.parentNode.removeChild(sc)}window[n]=function(r){if(d)return;cl();ok(r)};sc.src=url+'&callback='+n;sc.referrerPolicy='no-referrer';sc.onerror=function(){if(d)return;cl();f(new Error('n'))};tm=setTimeout(function(){if(!d){cl();f(new Error('t'))}},ms);document.head.appendChild(sc)})}

    function cleanStutter(text){
        text=text.replace(/(\S+)([\s,]+\1){2,}/gi,function(m,word){return word});
        text=text.replace(/\.(\s*\.)+/g,'.');
        text=text.replace(/,(\s*,)+/g,',');
        text=text.replace(/\s{2,}/g,' ');
        text=text.replace(/\.\s*,/g,'.');
        text=text.replace(/,\s*\./g,'.');
        text=text.replace(/\s+([.,:;!?])/g,'$1');
        text=text.replace(/([Оо])['\u2018\u2019]([Кк]ей)/g,"$1$2");
        text=text.replace(/([а-яёА-ЯЁa-zA-Z»)]) - ([а-яёА-ЯЁa-zA-Z«(])/g,"$1 — $2");
        text=text.replace(/(^|[.!?…])\s*- /gm,"$1 — ");
        text=text.replace(/яндекс[.\s]+(директ|метрика|маркет|музыка|карты|погода|браузер|доставка|лавка|такси|еда|плюс|диск|почта|афиша|кью)/gi,function(m,p){return'Яндекс '+p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()});
        text=text.replace(/вк\s+(реклама|видео|музыка|клипы|pay)/gi,function(m,p){return'VK '+p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()});
        text=text.replace(/гугл\s+(адс|аналитикс|хром|карты|докс|драйв|шитс|мит)/gi,function(m,p){return'Google '+p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()});
        text=text.replace(/google\s+(ads|analytics|chrome|maps|docs|drive|sheets|meet)/gi,function(m,p){return'Google '+p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()});
        return text.trim()
    }

    var pendingCopyText='',history=[],histPos=0,inNav=false,lastText='';
    function pushHistory(text){
        text=(text||'').trim();if(!text)return;
        if(inNav&&histPos>=0)history.length=histPos+1;
        inNav=false;
        if(history.length>0&&history[history.length-1]===text)return;

    }

        var isRedo=(e.metaKey||e.ctrlKey)&&((e.shiftKey&&(e.key==='z'||e.key==='Z'))||e.key==='y');
        if(isUndo){
            e.preventDefault();
            if(!inNav){
                var cur=getText().trim();
                if(cur)pushHistory(cur);
                if(!history.length)return;
                histPos=history.length;
                inNav=true
            }
            histPos--;
            if(histPos>=0&&history[histPos]===getText().trim()&&histPos>0)histPos--;
            if(histPos>=0){setText(history[histPos]);moveCursorEnd()}
            else{histPos=-1;setText('');setPlaceholder()}
        }
        if(isRedo&&inNav&&histPos<history.length-1){
            e.preventDefault();
            histPos++;
            setText(history[histPos]);moveCursorEnd()
        }
    });

        var t=$i.innerText||$i.textContent||'';if(!t.trim())return;
        hideTypoPop();hideTypoSettings();
        pushHistory(t.trim());
        var result=typograf(t);
        pushHistory(result.trim());
        var afterCheck=function(issues){
            if(issues&&issues.length){
                renderWithTypos(result,issues);
            }else{
                setText(result);copyText(result);showCheckmark();
            }
            setTimeout(function(){$i.focus()},0)
        };
        if(window.spellCheck&&window.spellReady&&window.spellReady()){
            window.spellCheck(result).then(afterCheck);
        }else{
            afterCheck([]);
        }
    });

    /* ── Панель настроек типографа (hover 1 сек) ── */
    var $typoSettings=document.getElementById('typoSettings');
    var typoHoverTimer=null;
    function renderTypoSettings(){
        var words=window.spellGetPersonal?window.spellGetPersonal():[];
        var html='<div class="typo-settings__title">Личный словарь</div>';
        if(words.length){
            words.forEach(function(w){
                html+='<div class="typo-settings__word"><span class="typo-settings__word-text">'+esc(w)+'</span>'
                    +'<button class="typo-settings__remove" data-del="'+esc(w)+'" title="Удалить">×</button></div>';
            });
        }else{
            html+='<div class="typo-settings__empty">Добавленных слов пока нет</div>';
        }
        $typoSettings.innerHTML=html;
    }
    function showTypoSettings(){
        renderTypoSettings();
        var btn=document.getElementById('typoBtn');
        var br=btn.getBoundingClientRect();
        var sa=document.querySelector('.search-area').getBoundingClientRect();
        $typoSettings.style.left=(br.left-sa.left+br.width/2)+'px';
        $typoSettings.style.bottom=(sa.bottom-br.top+8)+'px';
        $typoSettings.classList.add('visible');
    }
    function hideTypoSettings(){clearTimeout(typoHoverTimer);$typoSettings.classList.remove('visible')}
    document.getElementById('typoBtn').addEventListener('mouseenter',function(){
        typoHoverTimer=setTimeout(showTypoSettings,1000)
    });
    document.getElementById('typoBtn').addEventListener('mouseleave',function(e){
        clearTimeout(typoHoverTimer);
        if(!e.relatedTarget||!e.relatedTarget.closest('#typoSettings'))hideTypoSettings()
    });
    $typoSettings.addEventListener('mouseleave',function(){hideTypoSettings()});
    $typoSettings.addEventListener('click',function(e){
        var btn=e.target.closest('[data-del]');
        if(!btn)return;
        var w=btn.dataset.del;
        if(window.spellRemoveWord)window.spellRemoveWord(w);
        renderTypoSettings()
    });
    document.addEventListener('click',function(e){
        if(!e.target.closest('#typoSettings')&&!e.target.closest('#typoBtn'))hideTypoSettings()
    });

    /* ── Settings / tabs / popup ── */
    document.getElementById('settingsBtn').addEventListener('click',function(){openEdit(aIdx)});
    $t.addEventListener('click',function(e){var t=e.target.closest('.tab');if(!t)return;if(t.dataset.action==='add'){openAdd();return}if(t.dataset.idx!==undefined)setAct(parseInt(t.dataset.idx,10))});
    $s.addEventListener('click',function(e){var it=e.target.closest('.suggestion');if(!it)return;var i=parseInt(it.dataset.i,10);if(sug[i]){setText(sug[i]);go(sug[i]);hideS()}});
    document.addEventListener('click',function(e){if(!e.target.closest('.container'))hideS()});
    window.addEventListener('resize',function(){if($s.classList.contains('visible'))calcH()});

    var pColor=null,editMode=null,editKey=null,popupKeys=[];
    function renderPC(){$pc.innerHTML=PAL.map(function(c){return'<button class="swatch'+(c===pColor?' sel':'')+'" data-c="'+c+'" style="background:'+c+'"></button>'}).join('')}
    function renderPopupKeys(){
        var pp=document.getElementById('popup'),h1=pp.offsetHeight;
        $pkt.innerHTML=popupKeys.map(function(k,i){return'<div class="key-item"><input class="key-item__input" value="'+esc(k)+'" data-ki="'+i+'" maxlength="5"><span class="key-item__remove" data-ki="'+i+'">×</span></div>'}).join('');
        $pkt.style.display=popupKeys.length?'':'none';
        requestAnimationFrame(function(){var h2=pp.offsetHeight;if(Math.abs(h2-h1)>2){pp.style.height=h1+'px';pp.offsetHeight;pp.style.transition='transform .2s ease-out, height 300ms cubic-bezier(0.34,1.3,0.64,1)';pp.style.height=h2+'px';var done=function(ev){if(ev.propertyName==='height'){pp.style.height='';pp.style.transition='transform .2s ease-out';pp.removeEventListener('transitionend',done)}};pp.addEventListener('transitionend',done)}})
    }
    function addPopupKey(){var v=$pki.value.trim().toLowerCase();if(!v)return;if(popupKeys.indexOf(v)<0)popupKeys.push(v);renderPopupKeys();$pki.value=''}
    function openAdd(){editMode='add';editKey=null;pColor=null;$pn.value='';popupKeys=[];renderPopupKeys();$pki.value='';$pu.value='';$pdl.classList.remove('vis');renderPC();$ov.classList.add('open');setTimeout(function(){$pn.focus()},100)}
    function openEdit(idx){var e=engs[idx];if(!e)return;if(e.isDef){editMode='def';editKey=e.id}else{editMode='custom';editKey=idx-DEFS.length}$pn.value=e.name;popupKeys=(e.keys||[]).slice();renderPopupKeys();$pki.value='';$pu.value=e.url;pColor=e.color||null;$pdl.classList.add('vis');renderPC();$ov.classList.add('open');setTimeout(function(){$pn.focus()},100)}
    function closeP(){$ov.classList.remove('open');$i.focus()}
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$ov.classList.contains('open')){e.preventDefault();closeP()}});
    $ov.addEventListener('click',function(e){if(e.target===$ov)closeP()});
    $pc.addEventListener('click',function(e){var b=e.target.closest('.swatch');if(!b)return;pColor=b.dataset.c;$pc.querySelectorAll('.swatch').forEach(function(x){x.classList.toggle('sel',x.dataset.c===pColor)})});
    $pkt.addEventListener('click',function(e){var x=e.target.closest('.key-item__remove');if(!x)return;popupKeys.splice(parseInt(x.dataset.ki,10),1);renderPopupKeys()});
    $pkt.addEventListener('input',function(e){var inp=e.target.closest('.key-item__input');if(!inp)return;inp.value=inp.value.toLowerCase();popupKeys[parseInt(inp.dataset.ki,10)]=inp.value});
    $pka.addEventListener('click',addPopupKey);
    $pki.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addPopupKey()}});
    $pki.addEventListener('input',function(){var v=$pki.value,lo=v.toLowerCase();if(v!==lo){var p=$pki.selectionStart;$pki.value=lo;$pki.selectionStart=$pki.selectionEnd=p}});
    $pd.addEventListener('click',function(){var n=$pn.value.trim();if(!n){$pn.focus();return}var lo=n.toLowerCase();var f=SDB[lo];if(f){$pu.value=f;return}var raw=lo.replace(/\s+/g,'').replace(/[^a-z0-9а-яё.-]/gi,'');var doms=[];if(raw.indexOf('.')!==-1)doms.push(raw);else if(/[а-яё]/i.test(raw))doms.push(raw+'.ru',raw+'.com');else doms.push(raw+'.com',raw+'.ru');$pu.value='https://'+doms[0]+'/search?q='});
    $ps.addEventListener('click',function(){var nm=$pn.value.trim(),ur=$pu.value.trim();var pki=$pki.value.trim().toLowerCase();if(pki&&popupKeys.indexOf(pki)<0)popupKeys.push(pki);if(!nm){$pn.focus();return}if(!ur){$pu.focus();return}if(!ur.includes('%s')&&!ur.endsWith('=')&&!ur.endsWith('/'))ur+='?q=';if(editMode==='def'){defOvr[editKey]={name:nm,url:ur,color:pColor,keys:popupKeys.slice()};save();build();setAct(DEFS.findIndex(function(d){return d.id===editKey}))}else if(editMode==='custom'){custom[editKey]={name:nm,url:ur,color:pColor,keys:popupKeys.slice()};save();build();setAct(DEFS.length+editKey)}else{custom.push({name:nm,url:ur,color:pColor,keys:popupKeys.slice()});save();build();setAct(engs.length-1)}closeP()});
    $pdl.addEventListener('click',function(){if(editMode==='custom'&&editKey>=0){custom.splice(editKey,1);save();build();setAct(0);closeP()}else if(editMode==='def'&&editKey){delete defOvr[editKey];save();build();setAct(DEFS.findIndex(function(d){return d.id===editKey}));closeP()}});

    load();build();renderTabs();applyColor(engs[aIdx]);
    setPlaceholder('Loading...');
    $i.focus();
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&!micOn)setPlaceholder()});
})();
</script>
</body>
</html>
