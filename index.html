<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Поиск</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000;
            --surface: #141414;
            --surface-active: #474747;
            --surface-hover: #212121;
            --border: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(255, 255, 255, 0.25);
            --white-dim: rgba(255, 255, 255, 0.1);
            --text: #fff;
            --text-muted: rgba(255, 255, 255, 0.35);
            --radius-pill: 70px;
            --radius-card: 20px;
            --radius-item: 10px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Segoe UI', system-ui, sans-serif;
            font-size: 16px;
            line-height: 1;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tab {
            height: 39px;
            border-radius: var(--radius-pill);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            padding: 0 20px;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
        }

        .tab:hover { background: var(--surface-hover); }
        .tab.active { background: var(--surface-active); }
        .tab.active:hover { background: var(--surface-active); }
        .tab--add { padding: 0 14px; font-size: 20px; font-weight: 300; }

        /* ── Search input ── */
        .search-box {
            display: flex;
            align-items: center;
            border-radius: var(--radius-pill);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px;
            gap: 10px;
            transition: border-color 0.2s ease;
        }

        .search-box:focus-within {
            border-color: var(--border-focus);
        }

        .search-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            padding: 0 0 0 10px;
            line-height: 30px;
            caret-color: var(--text);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--white-dim);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
            flex-shrink: 0;
            outline: none;
        }

        .search-btn:hover { background: rgba(255, 255, 255, 0.18); }
        .search-btn:active { background: rgba(255, 255, 255, 0.25); }

        .search-btn svg {
            width: 14px;
            height: 14px;
            stroke: var(--text);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── Suggestions panel ── */
        .suggestions {
            border-radius: var(--radius-card);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 5px;
        }

        .suggestions.visible {
            display: flex;
            animation: suggestIn 0.14s ease-out;
        }

        @keyframes suggestIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .suggestion-item {
            border-radius: var(--radius-item);
            padding: 10px;
            cursor: pointer;
            transition: background 0.1s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 16px;
            line-height: 1.25;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .suggestion-item:hover,
        .suggestion-item.selected {
            background: var(--surface-hover);
        }

        .suggestion-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0.35;
        }

        .suggestion-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── Error / no results state ── */
        .suggestions-note {
            padding: 6px 10px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ── Keyboard shortcut hint ── */
        .hint {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 8px;
            user-select: none;
        }

        .hint kbd {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-family: inherit;
            font-size: 11px;
            margin: 0 1px;
        }

        /* ── Print ── */
        @media print {
            body { background: #000; color: #fff; }
            .suggestions { display: none !important; }
        }

        /* ── Bottom clearance for badge ── */
        .spacer { height: 52px; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs" id="tabs">
        <button class="tab active" data-engine="google">Google</button>
        <button class="tab" data-engine="yandex">Яндекс</button>
        <button class="tab" data-engine="youtube">YouTube</button>
        <button class="tab tab--add" data-action="add" title="Добавить поисковик">+</button>
    </div>

    <div class="search-box">
        <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="Поиск в Google"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            autofocus
        >
        <button class="search-btn" id="searchBtn" aria-label="Искать">
            <svg viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="13 6 19 12 13 18"/>
            </svg>
        </button>
    </div>

    <div class="suggestions" id="suggestions"></div>

    <div class="hint">
        <kbd>↑</kbd><kbd>↓</kbd> навигация &nbsp; <kbd>Enter</kbd> поиск &nbsp; <kbd>Tab</kbd> поисковик
    </div>
</div>

<div class="spacer"></div>

<script>
(function () {
    'use strict';

    /* ── Config ── */
    var ENGINES = {
        google: {
            name: 'Google',
            url: 'https://www.google.com/search?q=',
            placeholder: 'Поиск в Google',
        },
        yandex: {
            name: 'Яндекс',
            url: 'https://yandex.ru/search/?text=',
            placeholder: 'Поиск в Яндексе',
        },
        youtube: {
            name: 'YouTube',
            url: 'https://www.youtube.com/results?search_query=',
            placeholder: 'Поиск на YouTube',
        },
    };

    var ENGINE_ORDER = ['google', 'yandex', 'youtube'];

    var activeEngine = 'google';
    var suggestions = [];
    var selIdx = -1;
    var debounceTimer = null;
    var fetchId = 0;
    var lastQuery = '';

    /* ── DOM ── */
    var $input = document.getElementById('searchInput');
    var $sug   = document.getElementById('suggestions');
    var $btn   = document.getElementById('searchBtn');
    var $tabs  = document.getElementById('tabs');

    /* ── Fetch suggestions via fetch() with CORS ── */
    function fetchSuggestions(query) {
        var q = encodeURIComponent(query);
        var id = ++fetchId;
        var urls = [];

        if (activeEngine === 'google') {
            urls = [
                'https://suggestqueries.google.com/complete/search?client=firefox&hl=ru&gl=ru&q=' + q,
                'https://www.google.com/complete/search?client=firefox&hl=ru&gl=ru&q=' + q,
            ];
        } else if (activeEngine === 'youtube') {
            urls = [
                'https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&hl=ru&q=' + q,
                'https://www.google.com/complete/search?client=firefox&ds=yt&hl=ru&q=' + q,
            ];
        } else if (activeEngine === 'yandex') {
            urls = [
                'https://suggest.yandex.ru/suggest-ya?srv=morda_ru_desktop&wiz=TrWth&uil=ru&sn=5&lr=213&part=' + q,
                'https://yandex.ru/suggest/suggest-ya?srv=morda_ru_desktop&wiz=TrWth&uil=ru&sn=5&lr=213&part=' + q,
            ];
        }

        function tryFetch(urlIndex) {
            if (urlIndex >= urls.length) return Promise.resolve([]);
            return fetch(urls[urlIndex])
                .then(function (r) {
                    if (!r.ok) throw new Error(r.status);
                    return r.json();
                })
                .then(function (data) {
                    return (data && data[1]) || [];
                })
                .catch(function () {
                    return tryFetch(urlIndex + 1);
                });
        }

        return tryFetch(0).then(function (items) {
            if (id !== fetchId) return [];
            return items;
        });
    }

    /* ── Render ── */
    function renderSuggestions(items) {
        suggestions = items.slice(0, 6);
        selIdx = -1;

        if (suggestions.length === 0) {
            $sug.classList.remove('visible');
            return;
        }

        var searchSvg = '<svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>';

        $sug.innerHTML = suggestions.map(function (text, i) {
            var safe = escapeHtml(text);
            return '<div class="suggestion-item" data-i="' + i + '">'
                + searchSvg
                + '<span class="suggestion-text">' + safe + '</span>'
                + '</div>';
        }).join('');

        $sug.classList.add('visible');
    }

    function hideSuggestions() {
        $sug.classList.remove('visible');
        suggestions = [];
        selIdx = -1;
    }

    function updateSelection() {
        var items = $sug.querySelectorAll('.suggestion-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle('selected', i === selIdx);
        }
    }

    function escapeHtml(s) {
        var d = document.createElement('span');
        d.textContent = s;
        return d.innerHTML;
    }

    /* ── Search ── */
    function doSearch(query) {
        query = (query || '').trim();
        if (!query) return;
        window.open(ENGINES[activeEngine].url + encodeURIComponent(query), '_blank');
    }

    /* ── Tab switching ── */
    function setEngine(engine) {
        if (!ENGINES[engine] || engine === activeEngine) return;
        activeEngine = engine;

        var allTabs = $tabs.querySelectorAll('.tab[data-engine]');
        for (var i = 0; i < allTabs.length; i++) {
            allTabs[i].classList.toggle('active', allTabs[i].dataset.engine === engine);
        }

        $input.placeholder = ENGINES[engine].placeholder;
        hideSuggestions();

        if ($input.value.trim()) {
            triggerFetch();
        }

        $input.focus();
    }

    function cycleEngine(dir) {
        var idx = ENGINE_ORDER.indexOf(activeEngine);
        idx = (idx + dir + ENGINE_ORDER.length) % ENGINE_ORDER.length;
        setEngine(ENGINE_ORDER[idx]);
    }

    /* ── Debounced fetch ── */
    function triggerFetch() {
        var val = $input.value.trim();
        if (!val) { hideSuggestions(); return; }
        if (val === lastQuery) return;
        lastQuery = val;

        fetchSuggestions(val).then(renderSuggestions).catch(function () {
            hideSuggestions();
        });
    }

    /* ── Events ── */

    $input.addEventListener('input', function () {
        lastQuery = '';
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(triggerFetch, 180);
    });

    $input.addEventListener('keydown', function (e) {
        var key = e.key;

        if (key === 'Enter') {
            e.preventDefault();
            var q = selIdx >= 0 && suggestions[selIdx] ? suggestions[selIdx] : $input.value;
            doSearch(q);
            hideSuggestions();
            return;
        }

        if (key === 'ArrowDown') {
            e.preventDefault();
            if (suggestions.length === 0) return;
            selIdx = Math.min(selIdx + 1, suggestions.length - 1);
            updateSelection();
            $input.value = suggestions[selIdx];
            return;
        }

        if (key === 'ArrowUp') {
            e.preventDefault();
            if (selIdx > 0) {
                selIdx--;
                updateSelection();
                $input.value = suggestions[selIdx];
            } else if (selIdx === 0) {
                selIdx = -1;
                updateSelection();
            }
            return;
        }

        if (key === 'Escape') {
            hideSuggestions();
            return;
        }

        if (key === 'Tab') {
            e.preventDefault();
            cycleEngine(e.shiftKey ? -1 : 1);
            return;
        }
    });

    $btn.addEventListener('click', function () {
        doSearch($input.value);
    });

    $tabs.addEventListener('click', function (e) {
        var tab = e.target.closest('.tab');
        if (!tab) return;

        if (tab.dataset.action === 'add') return;
        if (tab.dataset.engine) setEngine(tab.dataset.engine);
    });

    $sug.addEventListener('click', function (e) {
        var item = e.target.closest('.suggestion-item');
        if (!item) return;
        var i = parseInt(item.dataset.i, 10);
        if (suggestions[i]) {
            $input.value = suggestions[i];
            doSearch(suggestions[i]);
            hideSuggestions();
        }
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.container')) {
            hideSuggestions();
        }
    });

    $input.addEventListener('focus', function () {
        if ($input.value.trim() && suggestions.length > 0) {
            $sug.classList.add('visible');
        }
    });

})();
</script>

</body>
</html>
