        .search-input .new-text{animation:voiceIn .3s ease forwards}
        @keyframes voiceIn{from{opacity:0.5;filter:blur(1px)}to{opacity:1;filter:blur(0)}}
        .search-bottom{align-self:stretch;border-radius:15px;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 10px;gap:20px;flex-shrink:0}

        @media print{body{background:#000}.suggestions,.po{display:none!important}}
    </style>
</head>

    $ps.addEventListener('click',function(){var nm=$pn.value.trim(),ur=$pu.value.trim();if(!nm){$pn.focus();return}if(!ur){$pu.focus();return}if(!ur.includes('%s')&&!ur.endsWith('=')&&!ur.endsWith('/'))ur+='?q=';if(editMode==='def'){defOvr[editKey]={name:nm,url:ur,color:pColor};save();build();setAct(DEFS.findIndex(function(d){return d.id===editKey}))}else if(editMode==='custom'){custom[editKey]={name:nm,url:ur,color:pColor};save();build();setAct(DEFS.length+editKey)}else{custom.push({name:nm,url:ur,color:pColor});save();build();setAct(engs.length-1)}closeP()});
    $pdl.addEventListener('click',function(){if(editMode==='custom'&&editKey>=0){custom.splice(editKey,1);save();build();setAct(0);closeP()}});

    load();build();renderTabs();applyColor(engs[aIdx]);
})();
</script>
