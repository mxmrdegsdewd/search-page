    </style>
</head>

            if(e.url.indexOf('yandex.ru/maps')!==-1){ep=SEP['yandex.ru/maps'];srcName='Яндекс Карты'}
            else if(SEP[dom]){ep=SEP[dom];srcName=dom}
            else{var pts=dom.split('.');if(pts.length>2){var par=pts.slice(-2).join('.');if(SEP[par]){ep=SEP[par];srcName=par}}}
            if(ep){
                sugSource=srcName||dom;
                p=pxFetch(ep.u,q,ep.p).then(function(r){
                    if(r.length)return r;
                    return scrapeSug(e.url,q).then(function(sr){
                        if(sr.length){sugSource=dom;return sr}
                        sugSource='Google';return gGet(q)
                    })
                })
            } else {
                sugSource=dom||e.name;
                p=scrapeSug(e.url,q).then(function(r){
                    if(r.length)return r;
                    sugSource='Google';return gGet(q)
                })
            }
        }
        return p.then(function(it){return id===fid?it:[]})
    }

    var ico='<svg class="si-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>';
    function calcH(){var r=$bx.getBoundingClientRect();$s.style.maxHeight=Math.max(120,window.innerHeight-r.bottom-15)+'px'}
    function showS(it){sug=it.slice(0,10);sel=-1;if(!sug.length){hideS();return}$s.innerHTML=sug.map(function(t,i){return'<div class="si" data-i="'+i+'">'+ico+'<span class="si-t">'+esc(t)+'</span></div>'}).join('');calcH();$s.scrollTop=0;$s.classList.add('visible');$src.textContent='from '+sugSource}
    function hideS(){$s.classList.remove('visible');sug=[];sel=-1;$src.textContent=''}
    function updS(){var it=$s.querySelectorAll('.si');for(var i=0;i<it.length;i++)it[i].classList.toggle('selected',i===sel);if(sel>=0&&it[sel])it[sel].scrollIntoView({block:'nearest'})}
    function esc(s){var d=document.createElement('span');d.textContent=s;return d.innerHTML}
    function go(q){q=(q||'').trim();if(q)window.open(engs[aIdx].url+encodeURIComponent(q),'_blank')}
    function doF(){var v=$i.value.trim();if(!v){hideS();return}getSug(v).then(function(r){if(r.length)showS(r)}).catch(function(){})}

    $i.addEventListener('input',function(){clearTimeout(tid);tid=setTimeout(doF,300)});
    $i.addEventListener('focus',function(){if($i.value.trim())doF()});
    $i.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();go(sel>=0&&sug[sel]?sug[sel]:$i.value);hideS()}else if(e.key==='ArrowDown'){e.preventDefault();if(!sug.length)return;sel=Math.min(sel+1,sug.length-1);updS();$i.value=sug[sel]}else if(e.key==='ArrowUp'){e.preventDefault();if(sel>0){sel--;updS();$i.value=sug[sel]}else if(sel===0){sel=-1;updS()}}else if(e.key==='Escape')hideS();else if(e.key==='Tab'){e.preventDefault();setAct((aIdx+(e.shiftKey?-1:1)+engs.length)%engs.length)}});
    $b.addEventListener('click',function(){go($i.value)});
    document.getElementById('settingsBtn').addEventListener('click',function(){openEdit(aIdx)});
    $t.addEventListener('click',function(e){var t=e.target.closest('.tab');if(!t)return;if(t.dataset.action==='add'){openAdd();return}if(t.dataset.idx!==undefined)setAct(parseInt(t.dataset.idx,10))});
    $s.addEventListener('click',function(e){var it=e.target.closest('.si');if(!it)return;var i=parseInt(it.dataset.i,10);if(sug[i]){$i.value=sug[i];go(sug[i]);hideS()}});
    document.addEventListener('click',function(e){if(!e.target.closest('.container'))hideS()});
    window.addEventListener('resize',function(){if($s.classList.contains('visible'))calcH()});

    var pColor=null,editMode=null,editKey=null;
    function renderPC(){$pc.innerHTML=PAL.map(function(c){return'<button class="pc'+(c===pColor?' sel':'')+'" data-c="'+c+'" style="background:'+c+'"></button>'}).join('')}
    function openAdd(){editMode='add';editKey=null;pColor=null;$pn.value='';$pu.value='';$pdl.classList.remove('vis');renderPC();$ov.classList.add('open');setTimeout(function(){$pn.focus()},100)}
    function openEdit(idx){var e=engs[idx];if(!e)return;if(e.isDef){editMode='def';editKey=e.id}else{editMode='custom';editKey=idx-DEFS.length}$pn.value=e.name;$pu.value=e.url;pColor=e.color||null;$pdl.classList.toggle('vis',editMode==='custom');renderPC();$ov.classList.add('open');setTimeout(function(){$pn.focus()},100)}
    function closeP(){$ov.classList.remove('open');$i.focus()}
    $ov.addEventListener('click',function(e){if(e.target===$ov)closeP()});
    $pc.addEventListener('click',function(e){var b=e.target.closest('.pc');if(!b)return;pColor=b.dataset.c;$pc.querySelectorAll('.pc').forEach(function(x){x.classList.toggle('sel',x.dataset.c===pColor)})});
    $pd.addEventListener('click',function(){
        var n=$pn.value.trim();if(!n){$pn.focus();return}
        var lo=n.toLowerCase();
        // 1. Check hardcoded DB
        var f=SDB[lo];if(!f){var cl=lo.replace(/\s+/g,'').replace(/[^a-zа-яё0-9]/gi,'');f=SDB[cl]}
        if(f){$pu.value=f;return}
        // 2. Auto-discover: fetch site homepage, parse forms & OpenSearch
        var raw=lo.replace(/\s+/g,'').replace(/[^a-z0-9а-яё.-]/gi,'');
        var doms=[];
        if(raw.indexOf('.')!==-1){doms.push(raw)}
        else if(/[а-яё]/i.test(raw)){doms.push(raw+'.ru',raw+'.com')}
        else{doms.push(raw+'.com',raw+'.ru',raw+'.org',raw+'.io')}
        $pd.textContent='Ищем...';$pd.style.opacity='0.5';
        discoverSearch(doms,0).then(function(url){
            $pu.value=url;$pd.textContent='Определить ключ';$pd.style.opacity=''
        }).catch(function(){
            $pu.value='https://'+doms[0]+'/search?q=';$pd.textContent='Не найден, проверьте';$pd.style.opacity='';
            setTimeout(function(){$pd.textContent='Определить ключ'},2000)
        })
    });
    function discoverSearch(doms,idx){
        if(idx>=doms.length)return Promise.reject();
        var base='https://'+doms[idx];
        return fetch(PROXY+encodeURIComponent(base),{signal:AbortSignal.timeout(6000)}).then(function(r){return r.text()}).then(function(html){
            var doc=new DOMParser().parseFromString(html,'text/html');
            // OpenSearch
            var osLink=doc.querySelector('link[rel="search"][type*="opensearch"]');
            if(osLink){
                var href=osLink.getAttribute('href')||'';
                if(href&&!href.startsWith('http'))href=base+(href.startsWith('/')?'':'/')+href;
                return fetch(PROXY+encodeURIComponent(href)).then(function(r){return r.text()}).then(function(xml){
                    var xd=new DOMParser().parseFromString(xml,'text/xml');
                    var urlEl=xd.querySelector('Url[type="text/html"]');
                    if(urlEl){var tpl=urlEl.getAttribute('template');if(tpl)return tpl.replace('{searchTerms}','')}
                    return parseForm(doc,base);
                }).catch(function(){return parseForm(doc,base)})
            }
            return parseForm(doc,base);
        }).then(function(r){if(r)return r;return discoverSearch(doms,idx+1)}).catch(function(){return discoverSearch(doms,idx+1)})
    }
    function parseForm(doc,base){
        var forms=doc.querySelectorAll('form');
        for(var i=0;i<forms.length;i++){
            var fm=forms[i],act=fm.getAttribute('action')||'';
            var inp=fm.querySelector('input[type="search"],input[type="text"][name]');
            if(!inp)continue;
            var nm=inp.getAttribute('name');if(!nm)continue;
            var url=act;
            if(!url.startsWith('http')){url=base+(url.startsWith('/')?'':'/')+url}
            url+=(url.indexOf('?')!==-1?'&':'?')+nm+'=';
            return url
        }
        // Check for path-based patterns (e.g. /word/{query})
        var links=doc.querySelectorAll('a[href]');
        var patterns={};
        for(var j=0;j<Math.min(links.length,200);j++){
            var h=links[j].getAttribute('href')||'';
            var m=h.match(/^(\/[a-z_-]+\/)[^\/]+$/i);
            if(m)patterns[m[1]]=(patterns[m[1]]||0)+1
        }
        var best=null,bestN=0;
        for(var k in patterns){if(patterns[k]>bestN){bestN=patterns[k];best=k}}
        if(best&&bestN>=3)return base+best;
        return null
    }
    $ps.addEventListener('click',function(){var nm=$pn.value.trim(),ur=$pu.value.trim();if(!nm){$pn.focus();return}if(!ur){$pu.focus();return}if(!ur.includes('%s')&&!ur.endsWith('=')&&!ur.endsWith('/'))ur+='?q=';if(editMode==='def'){defOvr[editKey]={name:nm,url:ur,color:pColor};save();build();setAct(DEFS.findIndex(function(d){return d.id===editKey}))}else if(editMode==='custom'){custom[editKey]={name:nm,url:ur,color:pColor};save();build();setAct(DEFS.length+editKey)}else{custom.push({name:nm,url:ur,color:pColor});save();build();setAct(engs.length-1)}closeP()});
    $pdl.addEventListener('click',function(){if(editMode==='custom'&&editKey>=0){custom.splice(editKey,1);save();build();setAct(0);closeP()}});

    load();build();renderTabs();applyColor(engs[aIdx]);
})();
</script>
