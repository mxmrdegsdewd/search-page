<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Поиск</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000;
            --surface: #141414;
            --surface-active: #474747;
            --surface-hover: #212121;
            --border: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(255, 255, 255, 0.25);
            --white-dim: rgba(255, 255, 255, 0.1);
            --text: #fff;
            --text-muted: rgba(255, 255, 255, 0.35);
            --radius-pill: 70px;
            --radius-card: 20px;
            --radius-item: 10px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Segoe UI', system-ui, sans-serif;
            font-size: 16px;
            line-height: 1;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ── Tabs (horizontal scroll, no wrap) ── */
        .tabs {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            height: 39px;
            border-radius: var(--radius-pill);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            padding: 0 20px;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
            line-height: 1;
        }

        .tab:hover { background: var(--surface-hover); }
        .tab.active { background: var(--surface-active); }
        .tab.active:hover { background: var(--surface-active); }

        .tab--add {
            width: 39px;
            padding: 0;
            font-size: 20px;
            font-weight: 300;
        }

        /* ── Search area ── */
        .search-area {
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            border-radius: var(--radius-pill);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px;
            gap: 10px;
            transition: border-color 0.2s ease;
            position: relative;
            z-index: 2;
        }

        .search-box:focus-within {
            border-color: var(--border-focus);
        }

        .search-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            padding: 0 0 0 10px;
            line-height: 30px;
            caret-color: var(--text);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--white-dim);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
            flex-shrink: 0;
            outline: none;
        }

        .search-btn:hover { background: rgba(255, 255, 255, 0.18); }
        .search-btn:active { background: rgba(255, 255, 255, 0.25); }

        .search-btn svg {
            width: 14px;
            height: 14px;
            stroke: var(--text);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── Suggestions dropdown ── */
        .suggestions {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            z-index: 10;
            border-radius: var(--radius-card);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px;
            padding-right: 6px;
            display: none;
            flex-direction: column;
            gap: 5px;
            max-height: 440px;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .suggestions.visible {
            display: flex;
            animation: suggestIn 0.12s ease-out;
        }

        .suggestions::-webkit-scrollbar { width: 4px; }
        .suggestions::-webkit-scrollbar-track { background: transparent; margin: 10px 0; }
        .suggestions::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }
        .suggestions::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
        .suggestions { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.12) transparent; }

        @keyframes suggestIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .suggestion-item {
            border-radius: var(--radius-item);
            padding: 10px;
            cursor: pointer;
            transition: background 0.1s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 16px;
            line-height: 1.25;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .suggestion-item:hover,
        .suggestion-item.selected {
            background: var(--surface-hover);
        }

        .suggestion-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0.35;
        }

        .suggestion-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media print {
            body { background: #000; color: #fff; }
            .suggestions { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs" id="tabs">
        <button class="tab active" data-engine="google">Google</button>
        <button class="tab" data-engine="yandex">Яндекс</button>
        <button class="tab" data-engine="youtube">YouTube</button>
        <button class="tab tab--add" data-action="add" title="Добавить поисковик">+</button>
    </div>

    <div class="search-area">
        <div class="search-box">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Поиск в Google"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                autofocus
            >
            <button class="search-btn" id="searchBtn" aria-label="Искать">
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="13 6 19 12 13 18"/>
                </svg>
            </button>
        </div>
        <div class="suggestions" id="suggestions"></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    var ENGINES = {
        google: {
            name: 'Google',
            url: 'https://www.google.com/search?q=',
            placeholder: 'Поиск в Google',
        },
        yandex: {
            name: 'Яндекс',
            url: 'https://yandex.ru/search/?text=',
            placeholder: 'Поиск в Яндексе',
        },
        youtube: {
            name: 'YouTube',
            url: 'https://www.youtube.com/results?search_query=',
            placeholder: 'Поиск на YouTube',
        },
    };

    var ENGINE_ORDER = ['google', 'yandex', 'youtube'];
    var MAX_ITEMS = 10;

    var activeEngine = 'google';
    var suggestions = [];
    var selIdx = -1;
    var debounceTimer = null;
    var fetchId = 0;
    var jsonpId = 0;

    var $input = document.getElementById('searchInput');
    var $sug   = document.getElementById('suggestions');
    var $btn   = document.getElementById('searchBtn');
    var $tabs  = document.getElementById('tabs');

    /* ── JSONP ── */
    function jsonp(url, timeout) {
        timeout = timeout || 4000;
        return new Promise(function (resolve, reject) {
            var name = '_cb' + (++jsonpId) + '_' + Date.now();
            var script = document.createElement('script');
            var done = false;
            var timer;

            function cleanup() {
                done = true;
                clearTimeout(timer);
                try { delete window[name]; } catch(e) { window[name] = undefined; }
                if (script.parentNode) script.parentNode.removeChild(script);
            }

            window[name] = function (data) {
                if (done) return;
                cleanup();
                resolve(data);
            };

            script.src = url + '&callback=' + name;
            script.onerror = function () {
                if (done) return;
                cleanup();
                reject(new Error('err'));
            };

            timer = setTimeout(function () {
                if (!done) { cleanup(); reject(new Error('timeout')); }
            }, timeout);

            document.head.appendChild(script);
        });
    }

    /* ── Engine-specific fetchers ── */

    function fetchGoogle(q) {
        return jsonp(
            'https://suggestqueries.google.com/complete/search?client=chrome&hl=ru&gl=ru&q=' + q
        ).then(function (d) { return (d && d[1]) || []; });
    }

    function fetchYouTube(q) {
        return jsonp(
            'https://suggestqueries.google.com/complete/search?client=chrome&ds=yt&hl=ru&q=' + q
        ).then(function (d) { return (d && d[1]) || []; });
    }

    function fetchYandex(q) {
        return jsonp(
            'https://suggest.yandex.ru/suggest-ya.cgi?v=4&srv=morda_ru_desktop&wiz=TrWth&uil=ru&sn=' + MAX_ITEMS + '&lr=213&part=' + q
        ).then(function (d) {
            if (!d || !d[1]) return [];
            return d[1].map(function (item) {
                return Array.isArray(item) ? item[1] : item;
            }).filter(Boolean);
        });
    }

    function fetchSuggestions(query) {
        var q = encodeURIComponent(query);
        var id = ++fetchId;
        var p;

        if (activeEngine === 'google')       p = fetchGoogle(q);
        else if (activeEngine === 'youtube')  p = fetchYouTube(q);
        else if (activeEngine === 'yandex')   p = fetchYandex(q);
        else                                  p = Promise.resolve([]);

        return p.then(function (items) {
            return id === fetchId ? items : [];
        });
    }

    /* ── Render ── */
    var searchSvg = '<svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>';

    function renderSuggestions(items) {
        suggestions = items.slice(0, MAX_ITEMS);
        selIdx = -1;

        if (suggestions.length === 0) {
            $sug.classList.remove('visible');
            return;
        }

        $sug.innerHTML = suggestions.map(function (text, i) {
            return '<div class="suggestion-item" data-i="' + i + '">'
                + searchSvg
                + '<span class="suggestion-text">' + escapeHtml(text) + '</span>'
                + '</div>';
        }).join('');

        $sug.scrollTop = 0;
        $sug.classList.add('visible');
    }

    function hideSuggestions() {
        $sug.classList.remove('visible');
        suggestions = [];
        selIdx = -1;
    }

    function updateSelection() {
        var items = $sug.querySelectorAll('.suggestion-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle('selected', i === selIdx);
        }
        if (selIdx >= 0 && items[selIdx]) {
            items[selIdx].scrollIntoView({ block: 'nearest' });
        }
    }

    function escapeHtml(s) {
        var d = document.createElement('span');
        d.textContent = s;
        return d.innerHTML;
    }

    function doSearch(query) {
        query = (query || '').trim();
        if (!query) return;
        window.open(ENGINES[activeEngine].url + encodeURIComponent(query), '_blank');
    }

    /* ── Tab switching (re-fetches suggestions) ── */
    function setEngine(engine) {
        if (!ENGINES[engine] || engine === activeEngine) return;
        activeEngine = engine;

        var allTabs = $tabs.querySelectorAll('.tab[data-engine]');
        for (var i = 0; i < allTabs.length; i++) {
            allTabs[i].classList.toggle('active', allTabs[i].dataset.engine === engine);
        }

        $input.placeholder = ENGINES[engine].placeholder;

        if ($input.value.trim()) {
            triggerFetch(true);
        } else {
            hideSuggestions();
        }

        $input.focus();
    }

    function cycleEngine(dir) {
        var idx = ENGINE_ORDER.indexOf(activeEngine);
        idx = (idx + dir + ENGINE_ORDER.length) % ENGINE_ORDER.length;
        setEngine(ENGINE_ORDER[idx]);
    }

    /* ── Debounced fetch ── */
    function triggerFetch(force) {
        var val = $input.value.trim();
        if (!val) { hideSuggestions(); return; }

        fetchSuggestions(val).then(renderSuggestions).catch(function () {
            hideSuggestions();
        });
    }

    /* ── Events ── */

    $input.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () { triggerFetch(); }, 150);
    });

    $input.addEventListener('keydown', function (e) {
        var key = e.key;

        if (key === 'Enter') {
            e.preventDefault();
            var q = selIdx >= 0 && suggestions[selIdx] ? suggestions[selIdx] : $input.value;
            doSearch(q);
            hideSuggestions();
        } else if (key === 'ArrowDown') {
            e.preventDefault();
            if (suggestions.length === 0) return;
            selIdx = Math.min(selIdx + 1, suggestions.length - 1);
            updateSelection();
            $input.value = suggestions[selIdx];
        } else if (key === 'ArrowUp') {
            e.preventDefault();
            if (selIdx > 0) {
                selIdx--;
                updateSelection();
                $input.value = suggestions[selIdx];
            } else if (selIdx === 0) {
                selIdx = -1;
                updateSelection();
            }
        } else if (key === 'Escape') {
            hideSuggestions();
        } else if (key === 'Tab') {
            e.preventDefault();
            cycleEngine(e.shiftKey ? -1 : 1);
        }
    });

    $btn.addEventListener('click', function () {
        doSearch($input.value);
    });

    $tabs.addEventListener('click', function (e) {
        var tab = e.target.closest('.tab');
        if (!tab) return;
        if (tab.dataset.action === 'add') return;
        if (tab.dataset.engine) setEngine(tab.dataset.engine);
    });

    $sug.addEventListener('click', function (e) {
        var item = e.target.closest('.suggestion-item');
        if (!item) return;
        var i = parseInt(item.dataset.i, 10);
        if (suggestions[i]) {
            $input.value = suggestions[i];
            doSearch(suggestions[i]);
            hideSuggestions();
        }
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.container')) {
            hideSuggestions();
        }
    });

    $input.addEventListener('focus', function () {
        if ($input.value.trim() && suggestions.length > 0) {
            $sug.classList.add('visible');
        }
    });

})();
</script>

</body>
</html>
